services:
  postgres:
    image: postgres:18-alpine
    container_name: purchasetx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: ${Postgres__Password}
      POSTGRES_DB: purchasetx
    ports:
      - "5432:5432"
    volumes:
      - purchasetx-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d purchasetx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  purchasetx-postgres-data:
